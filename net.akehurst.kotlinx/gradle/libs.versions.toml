[versions]
project = "2.4.0-SNAPSHOT"

kotlin = "2.4.0"
dokka = "2.2.0"
buildconfig = "6.1.2"
vanniktech = "0.37.0"
exportPublic = "2.4.0-SNAPSHOT"
ksp = "2.3.12"

korlibs = "6.1.0"
kotlinx-coroutines = "1.11.0"
kotlinx-wrappers = "2026.7.1"
kotlinx-serialization = "1.11.0"
cryptography = "0.6.0"
jna = "5.18.1"
log4j = "2.25.1"
jackson = "2.20.0"
kermit = "2.2.0"
oshai-kotlin-logging = "8.0.4"

[libraries]
ksp-api = { module = "com.google.devtools.ksp:symbol-processing-api", version.ref = "ksp" }
ksp-gradlePlugin = { module = "com.google.devtools.ksp:symbol-processing-gradle-plugin", version.ref = "ksp" }
korlibs-korio = { module = "org.korge:korlibs-io", version.ref = "korlibs" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
kotlinx-wrappers-js = { module = "org.jetbrains.kotlin-wrappers:kotlin-js", version.ref = "kotlinx-wrappers"  }
kotlinx-wrappers-browser = { module = "org.jetbrains.kotlin-wrappers:kotlin-browser", version.ref = "kotlinx-wrappers" }
kotlinx-serialization-core = { module = "org.jetbrains.kotlinx:kotlinx-serialization-core", version.ref = "kotlinx-serialization" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }
cryptography-core = {module="dev.whyoleg.cryptography:cryptography-core", version.ref="cryptography"}
cryptography-provider-optimal = {module="dev.whyoleg.cryptography:cryptography-provider-optimal", version.ref="cryptography"}
jna-platform = {module="net.java.dev.jna:jna-platform", version.ref="jna"}
log4j-api = { module = "org.apache.logging.log4j:log4j-api", version.ref = "log4j" }
log4j-core = { module = "org.apache.logging.log4j:log4j-core", version.ref = "log4j" }
log4j-slf4j2-impl = { module = "org.apache.logging.log4j:log4j-slf4j2-impl", version.ref = "log4j" }
log4j-jcl = { module = "org.apache.logging.log4j:log4j-jcl", version.ref = "log4j" }
log4j-jul = { module = "org.apache.logging.log4j:log4j-jul", version.ref = "log4j" }
log4j-v12-api = { module = "org.apache.logging.log4j:log4j-1.2-api", version.ref = "log4j" }
kermit = { module = "co.touchlab:kermit", version.ref = "kermit" }
oshai-kotlin-logging = { module = "io.github.oshai:kotlin-logging", version.ref = "oshai-kotlin-logging" }
jackson-dataformat-yaml = { module = "com.fasterxml.jackson.dataformat:jackson-dataformat-yaml", version.ref = "jackson" }

kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinx-coroutines" }


[plugins]
kotlin = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
dokka = { id = "org.jetbrains.dokka", version.ref = "dokka" }
exportPublic = { id = "net.akehurst.kotlin.gradle.plugin.exportPublic", version.ref = "exportPublic" }
buildconfig = { id = "com.github.gmazzo.buildconfig", version.ref = "buildconfig" }
jsPlainObjects = { id = "org.jetbrains.kotlin.plugin.js-plain-objects", version.ref = "kotlin" }
vanniktech-maven-publish = { id="com.vanniktech.maven.publish", version.ref="vanniktech" }
